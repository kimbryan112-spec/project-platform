<div id="app">

        <div class="logo">

            <h2>PROJECT PLATFORM</h2>

            <p>KBHFILMS</p>

        </div>

        <nav>

            <a
    id="adminMenu"
    href="admin.html"

    📊 Admin Dashboard
</a>

        </nav>

        <!-- Sidebar Footer -->

            <div class="user-info">

                <div class="user-name" id="userName"></div>

                <div class="user-role" id="userRole"></div>

            </div>

    🚪 Logout
</button>

        </div>

    </aside>

    <!-- Main -->

    <main class="main">

        <!-- Topbar -->

        <header class="topbar">

    <div class="topbar-left">

        <div class="page-title">
            <h1>Dashboard</h1>
            <p>Wedding Project Overview</p>
        </div>

        <div class="year-header">

    <div class="live-calendar">

        <div id="calendarMonth" class="calendar-month">
            AUG
        </div>

        <div id="calendarDay" class="calendar-day">
            21
        </div>

    </div>

    <h2>
        <span id="currentYearTitle">2026</span> Wedding Highlights
    </h2>

</div>

    </div>

    <div class="topbar-right">

        <select id="yearSelect"></select>

        <button class="next-year-btn">
            + Next Year
        </button>

        <div class="profile">
    <img src="../assets/images/kbhfilms logo.png" alt="KBHFILMS Logo">
</div>

    </div>

</header>

<!-- YEAR + MONTH NAVIGATION -->

<div class="year-month-panel">

    <div class="month-buttons">

        <button class="month-btn btn-3d has-data" data-month="jan">Jan ✓</button>

        <button class="month-btn btn-3d has-data" data-month="mar">Mar ✓</button>

        <button class="month-btn btn-3d" data-month="nov">Nov</button>
        <button class="month-btn btn-3d" data-month="dec">Dec</button>

    </div>

    <div class="month-legend">
        <span>🔵 No data yet</span>
        <span>🟢 Has data</span>

</div>

<script>
const currentUser = JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser) {
    window.location.href = "../login.html";
}

// Dashboard user at Admin lang ang pwede
if (
    currentUser.role !== "admin" &&
    currentUser.role !== "dashboard"
) {
    alert("Access Denied.");
    window.location.href = "../login.html";
}

const IS_ADMIN = currentUser.role === "admin";

// Hide Admin Dashboard menu for Manager
if (!IS_ADMIN) {
    const adminMenu = document.getElementById("adminMenu");

    if (adminMenu) {
        adminMenu.style.display = "none";
    }
}

// Show user info
document.getElementById("userName").textContent = currentUser.name || currentUser.username || "";

// Display Position
const roleMap = {
    admin: "Administrator",
    dashboard: "Manager"
};

document.getElementById("userRole").textContent =
    roleMap[currentUser.role] || currentUser.role;

</script>
