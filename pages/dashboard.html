<!-- WATCH MODAL -->

<div id="watchModal" class="modal">

    <div id="watchBox" class="modal-content watch-box">

        <div id="watchHeader" class="modal-header">

            <h3>KBHFILMS</h3>

            <div class="watch-controls">

                <button id="minimizeWatchBtn">➖</button>

                <button id="closeWatchModal">&times;</button>

            </div>

        </div>
